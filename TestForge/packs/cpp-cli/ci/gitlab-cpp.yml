testforge-cpp:
  image: gcc:14
  script:
    - apt-get update && apt-get install -y cmake ninja-build lcov
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - cmake --build build -j
    - ctest --test-dir build --output-on-failure
  artifacts:
    when: always
    paths:
      - build/Testing/
      - .testforge/reports/
