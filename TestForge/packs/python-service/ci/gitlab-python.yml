testforge-python:
  image: python:3.12
  script:
    - python -m pip install --upgrade pip
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - if [ -f pyproject.toml ]; then pip install -e .; fi
    - pip install pytest pytest-cov
    - if [ -f .testforge/cases/test-cases.json ]; then python testforge/testforge.py validate --cases .testforge/cases/test-cases.json; fi
    - pytest -q --cov=src --cov-branch --cov-report=json:coverage.json
  artifacts:
    when: always
    paths:
      - coverage.json
      - .testforge/reports/
