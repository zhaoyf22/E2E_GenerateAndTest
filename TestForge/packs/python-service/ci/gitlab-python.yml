testforge-python:
  image: python:3.12
  script:
    - python -m pip install --upgrade pip
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - if [ -f pyproject.toml ]; then pip install -e .; fi
    - pip install pytest pytest-cov
    - if [ -f .testforge/cases/test-cases.json ]; then python testforge/testforge.py validate --cases .testforge/cases/test-cases.json; fi
    - |
      if [ -f .testforge/run-manifest.json ]; then
        python testforge/testforge.py run --manifest .testforge/run-manifest.json --stack __STACK_ID__ --allow-failures
      else
        pytest -q
        mkdir -p .testforge/runs
        printf '{"suites":[],"summary":{"by_stack":{}}}' > .testforge/runs/run-results.json
      fi
    - python -m pytest -q --ignore=testforge --cov --cov-branch --cov-report=json:coverage.json
    # Mutation (mutmut) is optional: remove --allow-missing-reports after configuring it.
    - python testforge/testforge.py gate --stack __STACK_ID__ --results .testforge/runs/run-results.json --coverage coverage.json --allow-missing-reports --out .testforge/reports/gate-report.json
  artifacts:
    when: always
    paths:
      - coverage.json
      - mutants/
      - .testforge/reports/
      - .testforge/runs/
