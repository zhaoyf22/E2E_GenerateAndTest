name: testforge-python

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[test]" || pip install -e .; fi
          pip install pytest pytest-cov
      - name: Validate cases
        run: |
          if [ -f .testforge/cases/test-cases.json ]; then
            python testforge/testforge.py validate --cases .testforge/cases/test-cases.json
          fi
      - name: Run manifest (stack tests)
        run: |
          if [ -f .testforge/run-manifest.json ]; then
            python testforge/testforge.py run --manifest .testforge/run-manifest.json --stack __STACK_ID__ --allow-failures
          else
            pytest -q
            mkdir -p .testforge/runs
            printf '{"suites":[],"summary":{"by_stack":{}}}' > .testforge/runs/run-results.json
          fi
      - name: Coverage
        run: python -m pytest -q --ignore=testforge --cov --cov-branch --cov-report=json:coverage.json
      - name: Quality gate
        # Mutation (mutmut) is optional. Remove --allow-missing-reports after
        # installing and configuring mutmut for this stack.
        run: |
          python testforge/testforge.py gate \
            --stack __STACK_ID__ \
            --results .testforge/runs/run-results.json \
            --coverage coverage.json \
            --allow-missing-reports \
            --out .testforge/reports/gate-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testforge-python
          path: |
            coverage.json
            mutants/
            .testforge/reports/
            .testforge/runs/
          if-no-files-found: ignore
